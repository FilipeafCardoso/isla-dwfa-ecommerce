services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dwfa
      POSTGRES_USER: dwfa
      POSTGRES_PASSWORD: dwfa
    ports: ["5432:5432"]          # porta 5432 ocupada? · port busy? → "5433:5432" e DATABASE_URL com :5433
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwfa -d dwfa"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata: {}
